<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JB test</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg-void); }
  #trigger { position: fixed; left: 12px; top: 12px; z-index: 100; }
</style>
</head>
<body>
<button id="trigger" data-open-journal>Mở nhật ký</button>
<script type="module">
import { openJournalBook, bindJournalTriggers } from './journal-book.js';
import { JOURNAL_DAYS } from './journal-entries.js';

window.__open = (day) => openJournalBook({
  container: document.body,
  playerName: 'Watney',
  days: JOURNAL_DAYS,
  startDay: day ?? 1,
});
window.__bound = 0;
bindJournalTriggers({ root: document.body, onOpen: () => { window.__bound++; window.__open(1); } });
window.__days = JOURNAL_DAYS;
window.__ready = true;
</script>
</body>
</html>
