<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>avatar crop test</title>
<style>
  body { margin:0; background:#0b0f15; font:11px monospace; color:#8497aa; }
  #row { display:flex; gap:14px; padding:16px; align-items:flex-start; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:5px; width:200px; }
  .av {
    border-radius:50%; overflow:hidden;
    border:1px solid #8a6a33; background:#151b24; position:relative; flex:0 0 auto;
  }
  .av.s { width:38px; height:38px; }
  .av.b { width:180px; height:180px; }
  .av img { position:absolute; left:0; width:100%; height:100%; }
</style>
</head>
<body>
<div id="row"></div>
<script>
const src = 'assets/art/char-healthy.webp';
const variants = [
  { label: 'A cover 50/0',         fit:'cover',   pos:'50% 0%',  top:0 },
  { label: 'B cover 50/0 top1.5',  fit:'cover',   pos:'50% 0%',  top:1.5 },
  { label: 'C contain 50/50',      fit:'contain', pos:'50% 50%', top:0 },
  { label: 'D cover 50/0 top3',    fit:'cover',   pos:'50% 0%',  top:3 },
];
const row = document.getElementById('row');
for (const v of variants) {
  const cell = document.createElement('div');
  cell.className='cell';
  const lab = document.createElement('div'); lab.textContent = v.label;

  const big = document.createElement('div'); big.className='av b';
  const bi = document.createElement('img'); bi.src=src;
  bi.style.objectFit=v.fit; bi.style.objectPosition=v.pos; bi.style.top=v.top+'px';
  big.appendChild(bi);

  const sm = document.createElement('div'); sm.className='av s';
  const si = document.createElement('img'); si.src=src;
  si.style.objectFit=v.fit; si.style.objectPosition=v.pos; si.style.top=v.top+'px';
  sm.appendChild(si);

  cell.append(lab, big, sm);
  row.appendChild(cell);
}
</script>
</body>
</html>
