<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test gauges + trajectory (tam, se xoa)</title>
<link rel="stylesheet" href="./phase2.css">
<style>
  html, body { margin:0; padding:16px; background:#07090d; color:#b9c7d6;
    font-family:'Be Vietnam Pro', system-ui, sans-serif; }
  .row { display:grid; grid-template-columns: 1fr; gap:24px; max-width:1200px; margin:0 auto; }
  h1 { font-size:1rem; color:#e8a33d; }
</style>
</head>
<body>
<h1>Trang test tam</h1>
<div class="row">
  <section id="gauges"></section>
</div>
<button id="open-traj" style="min-height:44px;border:1px solid #e8a33d;background:#111721;color:#e8a33d;padding:0 16px;cursor:pointer;">Mo modal quy dao</button>
<script type="module">
  const BASE = new URL('.', import.meta.url).href;
  const engineMod = await import(BASE + 'phase2-engine.js');
  const engine = engineMod.phase2Engine || engineMod.default || engineMod.engine;
  window.__engine = engine;

  const g = await import(BASE + 'feature-gauges.js');
  g.mountGaugePanel({ container: document.getElementById('gauges'), engine });

  const t = await import(BASE + 'feature-trajectory.js');
  window.__openTrajectory = () => t.openTrajectoryModal({ engine });
  document.getElementById('open-traj').addEventListener('click', () => {
    window.__modal = window.__openTrajectory();
  });

  window.__ready = true;
</script>
</body>
</html>
